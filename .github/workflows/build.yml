name: Uygulamayi derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketleri kur
        run: npm install
      - name: Android projesini olustur
        run: npx cap add android
      - name: Bildirim ayarlari (Firebase)
        run: |
          cp google-services.json android/app/google-services.json
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_rafta.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M3,3h2v18H3zM19,3h2v18h-2zM5,6h14v2H5zM5,12h14v2H5zM5,18h14v2H5zM7,9h4v3H7zM13,15h4v3h-4z"/>
          </vector>
          XML
          sed -i 's#</application>#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rafta"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/rafta_renk"/><meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="sorular"/></application>#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="rafta_renk">#058a8e</color></resources>\n' > android/app/src/main/res/values/rafta_renk.xml
          grep -c ic_stat_rafta android/app/src/main/AndroidManifest.xml
      - name: Uygulama simgesi
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#058a8e' --splashBackgroundColor '#ffffff'
      - name: Kopyala
        run: npx cap sync android
      - name: Sabit imzayi kullan (guncellemeler eskisinin uzerine kurulsun)
        run: mkdir -p ~/.android && cp imza/debug.keystore ~/.android/debug.keystore
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Sabit imzayla imzala
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks imza/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out KorayRafta.apk android/app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify --print-certs KorayRafta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KorayRafta-apk
          path: KorayRafta.apk
      - name: Indirme sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum KorayRafta.apk --title "Koray - Rafta son surum" --notes "Telefondan KorayRafta.apk dosyasina dokunup indirin ve kurun."

  web:
    name: iPhone icin web surumu (hazirla)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www

  web-yayin:
    name: iPhone icin web surumu (yayinla)
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
