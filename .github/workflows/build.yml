name: Uygulamayi derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketleri kur
        run: npm install
      - name: Android projesini olustur
        run: npx cap add android
      - name: Uygulama simgesi
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#058a8e' --splashBackgroundColor '#058a8e'
      - name: Kopyala
        run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK adini duzelt
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DepoBul.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DepoBul-apk
          path: DepoBul.apk
      - name: Indirme sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum DepoBul.apk --title "Depo Bul - son surum" --notes "Telefondan DepoBul.apk dosyasina dokunup indirin ve kurun."

  web:
    name: iPhone icin web surumu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
